name: Build HD2312 Package

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择分支进行编译'
        required: true
        default: 'istoreos-24.10'
        type: choice
        options:
          - istoreos-24.10

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git subversion libncurses5-dev zlib1g-dev gawk flex bison unzip python3 rsync wget m4

      - name: Prepare DVB support and set target to x86_64
        run: |
          curl -L https://raw.githubusercontent.com/hanwckf/hd2312/master/openwrt/dvb-kconfig -o /tmp/dvb-kconfig
          curl -L https://raw.githubusercontent.com/hanwckf/hd2312/master/openwrt/dvb.mk -o /tmp/dvb.mk
          cat /tmp/dvb-kconfig >> target/linux/generic/config-6.6
          cp /tmp/dvb.mk package/kernel/linux/modules/
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-hd2312=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb=m" >> .config

      - name: Setup feeds and build toolchain
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make toolchain/compile V=s

      - name: Build entire kernel for x86_64
        run: |
          make target/linux/compile V=s

      - name: Compile HD2312 module
        run: |
          make package/hd2312/compile V=s
          # 创建输出目录
          mkdir -p output
          # 从标准内核模块构建目录查找并复制文件
          find build_dir/target-x86_64_musl -name "hd2312.ko" -exec cp -v {} output/ \;
          # 列出output目录下的文件以供确认
          ls -l output/

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD2312-Module
          path: output/hd2312.ko
